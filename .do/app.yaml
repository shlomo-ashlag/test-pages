# DigitalOcean App Platform spec for the test pages site
# create the app:  doctl apps create --spec .do/app.yaml
# update the app:  doctl apps update <app id> --spec .do/app.yaml
# serve.js reads this file too, so the local server answers like the deployed site
name: test-pages
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
static_sites:
  - name: test-pages-public
    environment_slug: html
    github:
      repo: shlomo-ashlag/test-pages
      branch: main
      deploy_on_push: true
    source_dir: public
    error_document: 404.html
ingress:
  rules:
    # test-download-pdf: script-like urls answered by real files, the browser url stays the same.
    # a static site takes Content-Type from the file extension, so the target file decides it
    - match:
        path:
          prefix: /test-download-pdf/cgi-bin/show_temp.pl
      component:
        name: test-pages-public
        rewrite: /test-download-pdf/files/sample.pdf
    - match:
        path:
          prefix: /test-download-pdf/documents/6006422
      component:
        name: test-pages-public
        rewrite: /test-download-pdf/files/sample.pdf
    - match:
        path:
          prefix: /test-download-pdf/cgi-bin/report.php
      component:
        name: test-pages-public
        rewrite: /test-download-pdf/files/sample.pdf
    - match:
        path:
          prefix: /test-download-pdf/cgi-bin/get.pl
      component:
        name: test-pages-public
        rewrite: /test-download-pdf/files/sample.bin
    # everything else is the site itself
    - match:
        path:
          prefix: /
      component:
        name: test-pages-public
